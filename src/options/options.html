<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="page_title">关键词云设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 data-i18n="page_title">关键词云设置</h1>
      <p class="hint" data-i18n="page_hint">可选 LLM 分析（优先）或本地词频。支持自定义 OpenAI 兼容接口，也支持本地免费 Ollama。</p>

      <label>
        <span data-i18n="keyword_mode">关键词模式</span>
        <select id="keywordMode">
          <option value="llm_first" data-i18n="keyword_mode_llm_first">LLM 优先（失败自动回退本地）</option>
          <option value="local" data-i18n="keyword_mode_local">仅本地词频</option>
        </select>
      </label>

      <label>
        <span data-i18n="llm_provider">LLM 提供方</span>
        <select id="llmProvider">
          <option value="ollama">Ollama（本地免费）</option>
          <option value="openai">OpenAI</option>
          <option value="openrouter">OpenRouter</option>
          <option value="deepseek">DeepSeek</option>
          <option value="groq">Groq</option>
          <option value="xai">xAI</option>
          <option value="together">Together AI</option>
          <option value="fireworks">Fireworks</option>
          <option value="siliconflow">SiliconFlow</option>
          <option value="moonshot">Moonshot</option>
          <option value="openai_compatible">OpenAI 兼容 API（自填）</option>
        </select>
      </label>

      <label>
        <span data-i18n="panel_language">面板语言</span>
        <select id="panelLanguage">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="ar">العربية</option>
          <option value="hi">हिन्दी</option>
          <option value="tr">Türkçe</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="nl">Nederlands</option>
          <option value="pl">Polski</option>
          <option value="sv">Svenska</option>
          <option value="he">עברית</option>
        </select>
      </label>

      <label>
        <span data-i18n="endpoint">Endpoint</span>
        <input id="llmEndpoint" data-i18n-placeholder="endpoint_placeholder" placeholder="https://api.openai.com/v1/chat/completions" />
        <div class="hint" data-i18n="endpoint_hint">选择预设厂商时会自动填充 endpoint；仅在私有网关/兼容接口时手动填写。</div>
      </label>

      <label>
        <span data-i18n="model">Model</span>
        <input id="llmModel" data-i18n-placeholder="model_placeholder" placeholder="gpt-4o-mini / qwen2.5:7b-instruct" />
      </label>

      <label>
        <span data-i18n="api_key">API Key（Ollama 可留空）</span>
        <input id="llmApiKey" type="password" data-i18n-placeholder="api_key_placeholder" placeholder="sk-..." />
      </label>

      <label>
        <span data-i18n="keywords_per_doc">单篇文章关键词数量</span>
        <select id="keywordsPerDoc">
          <option value="5" data-i18n="keywords_per_doc_5">5 个</option>
          <option value="10" data-i18n="keywords_per_doc_10">10 个</option>
        </select>
      </label>

      <label>
        <span data-i18n="search_pages">抓取页数</span>
        <select id="searchPages">
          <option value="1" data-i18n="search_pages_1">1 页</option>
          <option value="5" data-i18n="search_pages_5">5 页</option>
          <option value="10" data-i18n="search_pages_10">10 页</option>
        </select>
      </label>

      <label>
        <span data-i18n="keyword_limit">关键词上限</span>
        <input id="keywordLimit" type="number" min="10" max="200" />
      </label>

      <label>
        <span data-i18n="min_len">最小词长</span>
        <input id="minLen" type="number" min="1" max="6" />
      </label>

      <button id="save" data-i18n="save">保存设置</button>
      <p id="status"></p>
    </main>
    <script type="module" src="./options.js"></script>
  </body>
</html>
